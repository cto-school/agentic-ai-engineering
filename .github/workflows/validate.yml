name: Validate course

on:
  push:
  pull_request:

jobs:
  course-and-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Validate course materials
        run: python validate_course.py
      - name: Install portal dependencies
        run: pnpm --dir course-portal install --frozen-lockfile
      - name: Build portal
        run: pnpm --dir course-portal build
